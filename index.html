<html lang="el"><head>
  <meta charset="UTF-8">
<title>𝕸𝖚𝖘𝖎𝖈🌹𝕮𝖍𝖔𝖎𝖈𝖊𝖘</title>
<style>
* {
 
  overflow: hidden;
  font-family: sans-serif;
  text-transform: uppercase;
  font-size: 12px;
  color: #FFFFFF;
}

#area-video {
  cursor: none;
  position: relative;
  overflow: hidden;
  width: 100%px;
  height: 100%px;
  background-color: transparent;
}

.cursor {
  text-align: center;
  top: -100px;
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 80px;
  height: 80px;
  background-color: rgba(0,0,0,.6);
  border-radius: 50%;
}

#video {
  width: 100%; 
  height: 100%;
  object-fit: cover;
}
</style>

  <script>
  window.console = window.console || function(t) {};
</script>

  
  
</head>

<body translate="no">
  <div id="area-video">
  <div class="cursor" style="top: -33px; left: 866px;">Click Audio</div>
  <video id="video" autoplay="" loop="" muted="">
    <source src="https://gra1.crystalweb.net:1936/barazatv/barazatv/playlist.m3u8" type="video/mp4">
  </video>
</div>
  
    <script id="rendered-js">
const cursor = document.querySelector('.cursor');

document.addEventListener('mousemove', e => {
  cursor.setAttribute('style', 'top: ' + (e.pageY - 40) + 'px; left: ' + (e.pageX - 40) + 'px;');
});

function toggleMute() {
  let video = document.getElementById("video");
  if (video.muted) {
    video.muted = false;
  } else {
    video.muted = true;
  }
}

document.getElementById("video").addEventListener("click", toggleMute);
//# 
  </script><script>

    var message = "𝕸𝖚𝖘𝖎𝖈💕𝕮𝖍𝖔𝖎𝖈𝖊𝖘🌹𝕱𝖗𝖊𝖊 𝕮𝖔𝖕𝖞";

    function clickIE4() {
        if (event.button == 2) {
            alert(message);
            return false;
        }
    }

    function clickNS4(e) {
        if (document.layers || document.getElementById && !document.all) {
            if (e.which == 2 || e.which == 3) {
                alert(message);
                return false;
            }
        }
    }

    if (document.layers) {
        document.captureEvents(Event.MOUSEDOWN);
        document.onmousedown = clickNS4;
    } else if (document.all && !document.getElementById) {
        document.onmousedown = clickIE4;
    }

    document.oncontextmenu = new Function("alert(message);return false")
</script>
<script>

    function disableselect(e) {
        return false
    }
    function reEnable() {
        return true
    }
    document.onselectstart = new Function("return false")
    if (window.sidebar) {
        document.onmousedown = disableselect
        document.onclick = reEnable
    }
</script>
<script>
        window.oncontextmenu = function () {
            console.log("Right Click Disabled");
            return false;
        }
    </script>
</body></html>
